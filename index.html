  function salvarNova() {

    return `<div class="linha entre"><div><h2>OF ${esc(o.codigo)}</h2><div class="sec">${esc(o.obra)}${o.descricao ? " · " + esc(o.descricao) : ""}</div></div>${botoes}</div>
      ${fora ? `<div class="av">${motivos[fora.motivo] || fora.motivo}</div>` : ""}
      ${of ? `<ul style="list-style:none;padding:0;display:flex;flex-direction:column;gap:4px">${of.etapas.map((e) => `<li><strong style="font-weight:500">${P.etapaLabel(e.etapa)}:</strong> ${e.recursoIds.map(nome).join(" + ")}<span class="sec" style="display:block">${e.inicio === e.fim ? fd(e.inicio) : fd(e.inicio) + " a " + fd(e.fim)}</span></li>`).join("")}</ul>
      <dl><dt>Fim da produção</dt><dd>${fd(of.fimProducao)}</dd><dt>Carregamento</dt><dd style="font-weight:500">${fd(of.carregamento)}</dd><dt>Data do cliente</dt><dd ${of.estouro ? 'class="err"' : ""}>${fd(of.dataEntregaCliente)}${of.estouro ? " (passa desta data)" : ""}</dd></dl>` : ""}`;
  }
  function blocoMover(o) {
    const l = fila(), pos = l.findIndex((x) => x.id === o.id) + 1, outras = l.filter((x) => x.id !== o.id);
    return `<div class="linha"><span><strong style="font-weight:500">Lugar na fila:</strong> ${pos}ª de ${l.length}</span>${S.mover === o.id ? "" : `<button class="btn mini" data-a="abrirMover" data-id="${o.id}">Mudar de lugar</button>`}</div>
      ${S.mover === o.id ? `<label class="c">Colocar logo depois de<select class="ctl" id="moverPara">${opcoes(outras, "")}</select></label><div class="linha"><button class="btn p mini" data-a="mover" data-id="${o.id}">Mover</button><button class="btn mini" data-a="fecharMover">Cancelar</button></div>` : ""}`;
  }
  function telaCriada() {
    const c = S.criada, o = porId(c.id), r = calcular();
    return `<h1>OF ${esc(o.codigo)} criada</h1>
      <div class="n sucesso" role="status">OF ${esc(o.codigo)} criada em ${c.posicao}ª posição. ${c.desceram ? `${c.desceram} OF(s) desceram uma posição.` : "Ela entrou no fim da fila."}</div>
      ${o.lib ? "" : `<div class="n aviso">Sem data de liberação, ela fica fora do cálculo. <button class="link" data-t="falta">Preencher em O que falta</button></div>`}
      <div class="caixa" style="max-width:520px">${blocoMover(o)}</div>
      <div class="painel" style="max-width:520px;position:static">${detalhes(c.id, r, "")}</div>
      <div class="linha"><button class="btn p" data-t="prog">Ver na Programação</button><button class="btn" data-t="rotina">Ver na Rotina</button><button class="btn" data-t="nova">Criar outra OF</button></div>`;
  }
  // ---- Rotina
  function selos(o) {
    const concl = P.producaoConcluida({ CORTE: o.dias.CORTE, USINAGEM: o.dias.USINAGEM, MONTAGEM: o.dias.MONTAGEM, COLAGEM: o.dias.COLAGEM });
    const est = o.dias.ESTOQUE > 0;
    return (concl ? `<span class="selo sucesso">Produção concluída</span> ` : "") + (est ? `<span class="selo aviso">estoque: fora do cálculo</span>` : "");
  }
  function telaRotina() {
    const l = fila();
    return `<h1>Rotina diária</h1><p class="sec" style="margin:0">${l.length} OFs ativas, na ordem da fila. Os dias são <strong>o que ainda falta</strong>. Digite e tecle Enter para salvar e descer; as setas mudam a ordem.</p>
    ${S.msg ? `<div class="n sucesso" role="status">${esc(S.msg)}</div>` : ""}
    <div class="rolar"><table><thead><tr><th>Lugar</th><th>OF</th><th>Obra / descrição</th><th>Liberação</th>${["Corte", "Usinagem", "Montagem", "Colagem"].map((t) => `<th>${t}</th>`).join("")}<th>Situação</th></tr></thead><tbody>
    ${l.map((o, i) => `<tr data-linha="${o.id}"><td style="white-space:nowrap"><button class="btn mini" data-a="sobe" data-id="${o.id}" aria-label="Subir ${esc(o.codigo)}" ${i === 0 ? "disabled" : ""}>↑</button> <button class="btn mini" data-a="desce" data-id="${o.id}" aria-label="Descer ${esc(o.codigo)}" ${i === l.length - 1 ? "disabled" : ""}>↓</button> ${i + 1}</td>
      <td style="font-weight:500">${esc(o.codigo)}</td><td style="min-width:150px">${esc(o.obra)}<div class="peq sec">${esc(o.descricao)}</div></td><td style="white-space:nowrap">${o.lib ? fd(o.lib) : '<span class="av">sem data</span>'}</td>
      ${P.ETAPAS_GANTT.map((et) => `<td><input class="dia" inputmode="decimal" data-rdia="${et}" data-id="${o.id}" aria-label="${P.etapaLabel(et)} de ${esc(o.codigo)}" placeholder="-" value="${o.dias[et] == null ? "" : P.formatDias(o.dias[et])}"></td>`).join("")}
      <td style="min-width:150px">${selos(o)}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="caixa linha entre" style="flex-direction:row"><span>Depois de atualizar os dias, veja como a fila fica nas máquinas.</span><button class="btn" data-t="prog">Abrir a Programação</button></div>`;
  }
  // ---- Programação
  function grade(r, dias, recs) {
    const cel = new Map(); r.programacao.forEach((l) => { const k = l.recursoId + "|" + l.data; cel.set(k, [...(cel.get(k) || []), l]); });
    const sem = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
    return `<div class="rolar"><table class="g" style="min-width:${Math.max(320, recs.length * 110)}px"><thead><tr><th>Dia</th>${recs.map((x) => `<th>${x.nome}</th>`).join("")}</tr></thead><tbody>
    ${dias.map((d) => `<tr><td style="white-space:nowrap;font-weight:500">${sem[new Date(d + "T00:00:00Z").getUTCDay()]} ${P.formatarDataCurta(d)}</td>${recs.map((x) => { const it = (cel.get(x.id + "|" + d) || []).sort((a, b) => a.ordemNoDia - b.ordemNoDia); const tot = it.reduce((n, l) => n + l.minutos, 0);
      return `<td>${it.map((l) => `<span class="of ${S.sel === l.ofId ? "sel" : S.sel !== null ? "apaga" : ""}"><button class="of-b" data-of="${l.ofId}">${esc(l.codigo)}</button> <span class="sec">${P.textoDias(P.minutosEmDias(l.minutos, x.minutosDiaPadrao))}</span>${l.observacao ? ` <span class="selo info">${l.observacao}</span>` : ""}</span>`).join("")}<div class="ocu" title="Ocupação do dia"><i style="width:${Math.round(Math.min(P.ocupacaoDoDia(tot, x.minutosDiaPadrao), 1) * 100)}%"></i></div></td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function porOf(r, dias) {
    const ofs = S.maquina === null ? r.ofs : r.ofs.filter((o) => o.etapas.some((e) => e.recursoIds.includes(S.maquina)));
    return `<div class="linha peq sec">${P.ETAPAS_GANTT.map((e) => `<span><i class="leg ${e}"></i>${P.etapaLabel(e)}</span>`).join("")}</div><div class="rolar"><table class="g" style="min-width:760px"><thead><tr><th>OF</th>${dias.map((d) => `<th style="padding:8px 2px">${P.formatarDataCurta(d)}</th>`).join("")}<th>Carregamento</th></tr></thead><tbody>
    ${ofs.map((o) => `<tr class="${S.sel === o.ofId ? "sel" : ""}"><td style="white-space:nowrap"><button class="of-b" data-of="${o.ofId}">${esc(o.codigo)}</button></td>${P.etapasPorDia(o, dias).map((et) => `<td class="gantt" style="padding:6px 2px">${et.map((e) => `<span class="${e}"></span>`).join("")}</td>`).join("")}<td style="white-space:nowrap;font-weight:500">${fd(o.carregamento)}</td></tr>`).join("")}</tbody></table></div>${ofs.length ? "" : '<p class="sec">Nenhuma OF programada nesta máquina.</p>'}`;
  }
  function telaProg() {
    const r = calcular(), prov = S.jornada ? [] : NOMES, avisos = P.montarAvisos(r, prov), sit = P.situacaoProposta(r, 0);
    if (!S.inicio) S.inicio = r.dataBase;
    const dias = P.readDiasUteis(S.inicio, FERIADOS, DIAS), prox = P.readDiasUteis(dias[DIAS - 1], FERIADOS, 2)[1], ant = P.readDiasUteis(S.inicio, FERIADOS, DIAS, -1)[0];
    const recs = (S.maquina === null ? RECURSOS : RECURSOS.filter((x) => x.id === S.maquina));
    const atual = avisos.find((a) => a.id === S.aviso);
    const destino = { "/pendencias#liberacao": "falta", "/pendencias#estoque": "falta", "/cadastros/recursos": "falta" };
    return `<h1>Programação</h1>
    <section class="caixa"><div class="linha entre"><div><strong style="font-weight:500">Nenhum plano gravado</strong><div class="sec">${esc(sit.texto)}</div><div class="sec">Calculado a partir de ${fd(r.dataBase)}: ${r.ofs.length} OFs programadas, ${r.naoProgramadas.length} fora do cálculo.</div></div><button class="btn p" data-a="aprovar">Revisar e aprovar</button></div></section>
    <div class="linha"><span class="sec">Avisos:</span>${avisos.map((a) => `<button class="n ${a.tom}" style="padding:5px 10px" data-aviso="${a.id}" aria-expanded="${S.aviso === a.id}">${esc(a.rotulo)}</button>`).join("")}</div>
    ${atual ? `<div class="n ${atual.tom}"><strong style="font-weight:500">${esc(atual.explicacao)}</strong>${atual.acao ? ` <button class="link" data-t="${destino[atual.acao.href] || "falta"}">Resolver em O que falta</button>` : ""}
      <div class="linha" style="margin-top:6px;gap:4px 14px">${atual.itens.map((i) => i.ofId !== undefined ? `<button class="link" data-of="${i.ofId}">${esc(i.texto)}</button>` : `<span>${esc(i.texto)}</span>`).join("")}</div></div>` : ""}
    <div class="linha" style="gap:8px 20px"><div class="linha" style="gap:4px"><button class="btn" aria-pressed="${S.visao === "maquina"}" data-visao="maquina">Por máquina</button><button class="btn" aria-pressed="${S.visao === "of"}" data-visao="of">Por OF</button></div>
      <div class="linha" style="gap:4px"><button class="btn" aria-pressed="${S.maquina === null}" data-maq="">Todas</button>${RECURSOS.map((x) => `<button class="btn" aria-pressed="${S.maquina === x.id}" data-maq="${x.id}">${x.nome}</button>`).join("")}</div>
      <div class="linha"><button class="btn" data-ini="${ant}" aria-label="3 semanas antes">‹</button><span style="white-space:nowrap">${fd(dias[0])} a ${fd(dias[DIAS - 1])}</span><button class="btn" data-ini="${prox}" aria-label="3 semanas depois">›</button></div></div>
    <div class="grade"><div style="min-width:0">${S.visao === "maquina" ? grade(r, dias, recs) : porOf(r, dias)}</div>
      ${S.sel !== null && porId(S.sel) ? `<aside class="painel">${detalhes(S.sel, r, '<button class="link" data-a="fechar">Fechar</button>')}${blocoMover(porId(S.sel))}</aside>` : `<aside class="painel vazio">Clique numa OF para ver as etapas, as máquinas e a data de carregamento.</aside>`}</div>
    ${S.janela ? `<div class="fundo"><div class="janela" role="dialog" aria-modal="true" aria-labelledby="tJ"><h2 id="tJ">Aprovar e gravar a programação</h2><ul class="sec"><li>${r.ofs.length} OFs programadas e ${r.naoProgramadas.length} fora do cálculo.</li><li>Na ferramenta, aqui você escreve o motivo e confirma. A entrega prevista das OFs passa a ser o carregamento calculado.</li></ul><div class="n aviso">Nesta simulação nada é gravado.</div><div class="linha" style="justify-content:flex-end"><button class="btn" data-a="fecharJanela">Fechar</button></div></div></div>` : ""}`;
  }
  // ---- O que falta
  function telaFalta() {
    const l = fila(); const { itens, resolvidos } = P.montarPendencias({
      hoje, recursos: NOMES.map((nome) => ({ nome, jornadaConfirmada: S.jornada })), feriados: S.calendario ? [...FERIADOS, { data: dia(30), escopo: "RECESSO" }] : FERIADOS,
      ofs: l.map((o, i) => ({ id: o.id, codigo: o.codigo, prioridade: o.prioridade, posicao: i + 1, obra: o.obra, descricao: o.descricao, liberacao: o.lib, atualizadoEm: "", etapas: ETAPAS.filter((e) => o.dias[e] != null).map((e) => ({ etapa: e, origem: "MANUAL", duracaoMinutos: null, duracaoDiasManual: o.dias[e], maquinasPermitidas: (o.maq[e] || []).length })) })),
    });
    const acoes = { jornada: ["jornada", "Confirmar as jornadas"], maquinas: ["maquinas", "Marcar as máquinas"], estoque: ["estoque", "Tirar o estoque destas OFs"], calendario: ["calendario", "Cadastrar o recesso"] };
    return `<h1>O que falta</h1><section class="caixa"><strong style="font-weight:500;font-size:16px">Pronto para a primeira aprovação: ${resolvidos} de ${itens.length} itens resolvidos</strong><div class="barra"><i style="width:${Math.round(resolvidos / itens.length * 100)}%"></i></div></section>
    ${S.msg ? `<div class="n sucesso" role="status">${esc(S.msg)}</div>` : ""}
    ${itens.map((it) => `<section style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px"><div class="linha"><h2>${esc(it.titulo)}</h2><span class="selo ${it.resolvido ? "sucesso" : "aviso"}">${it.resolvido ? "resolvido" : "pendente"}</span></div><div>${esc(it.resumo)}</div>
      ${it.id === "liberacao" && !it.resolvido ? `<div class="rolar"><table><thead><tr><th>Lugar</th><th>OF</th><th>Obra</th><th>Data de liberação</th></tr></thead><tbody>${l.map((o, i) => o.lib ? "" : `<tr><td>${i + 1}</td><td style="font-weight:500">${esc(o.codigo)}</td><td>${esc(o.obra)}</td><td><form class="linha" data-lib="${o.id}"><input type="date" class="dia" style="width:150px" required aria-label="Liberação de ${esc(o.codigo)}"><button class="btn mini">Salvar</button></form></td></tr>`).join("")}</tbody></table></div>` : ""}
      ${acoes[it.id] && !it.resolvido ? `<div><button class="btn" data-acao="${acoes[it.id][0]}">${acoes[it.id][1]}</button></div>` : ""}</section>`).join("")}`;
  }
  const TELAS = { nova: ["Nova OF", telaNova], rotina: ["Rotina diária", telaRotina], prog: ["Programação", telaProg], falta: ["O que falta", telaFalta], criada: [null, telaCriada] };
  function render() {
    const atual = S.tela === "criada" ? "nova" : S.tela;
    document.getElementById("app").innerHTML = `<div class="faixa"><span><strong>Simulação com dados fictícios.</strong> Pode mexer à vontade: nada é gravado e, ao recarregar, tudo volta ao início.</span><button class="btn mini" data-a="recomecar">Recomeçar</button></div>
      <header class="topo"><span class="marca">PCP Estrutural</span><nav aria-label="Telas">${["nova", "rotina", "prog", "falta"].map((t) => `<button class="btn" data-t="${t}" ${t === atual ? 'aria-current="page"' : ""}>${TELAS[t][0]}</button>`).join("")}</nav></header>
      <main>${TELAS[S.tela][1]()}</main>`;
  }
  function ir(t) { S.tela = t; S.msg = null; S.erros = {}; S.mover = null; if (t === "nova" && S.criada) S.criada = null; render(); window.scrollTo(0, 0); }
  function mover(id, novaPos) { P.reordenar(fila().map(item), id, novaPos).forEach((m) => { porId(m.id).prioridade = m.depois; }); }

  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return; const d = b.dataset;
    if (d.t) return ir(d.t);
    if (d.of) { S.sel = S.sel === +d.of ? null : +d.of; return render(); }
    if (d.aviso) { S.aviso = S.aviso === d.aviso ? null : d.aviso; return render(); }
    if (d.visao) { S.visao = d.visao; return render(); }
    if (d.maq !== undefined) { S.maquina = d.maq === "" ? null : +d.maq; return render(); }
    if (d.ini) { S.inicio = d.ini; return render(); }
    if (d.acao) {
      if (d.acao === "jornada") S.jornada = true;
      if (d.acao === "calendario") S.calendario = true;
      if (d.acao === "estoque") S.ofs.forEach((o) => { if (o.dias.ESTOQUE > 0) o.dias.ESTOQUE = null; });
      if (d.acao === "maquinas") S.ofs.forEach((o) => ["CORTE", "USINAGEM", "MONTAGEM", "COLAGEM"].forEach((e) => { if (o.dias[e] > 0 && !(o.maq[e] || []).length) o.maq[e] = [...MAQ[e]]; }));
      S.msg = null; return render();
    }
    const id = +d.id, a = d.a;
    if (a === "recomecar") return recomecar();
    if (a === "exemplo") { S.form = { ...formVazio(), obra: OBRAS[1], descricao: "Fachada de exemplo", lugar: "escolher", depoisDe: String(fila()[1].id), lib: hoje, cliente: dia(45), dias: { CORTE: "2", USINAGEM: "1", MONTAGEM: "3", COLAGEM: "1" }, maq: { CORTE: [1] } }; S.erros = {}; return render(); }
    if (a === "aprovar") { S.janela = true; return render(); }
    if (a === "fecharJanela") { S.janela = false; return render(); }
    if (a === "fechar") { S.sel = null; return render(); }
    if (a === "abrirMover") { S.mover = id; return render(); }
    if (a === "fecharMover") { S.mover = null; return render(); }
    if (a === "mover") {
      const v = document.getElementById("moverPara").value; if (!v) return;
      const pos = P.posicaoDepoisDe(fila().filter((o) => o.id !== id).map((o) => o.id), v === "inicio" ? null : +v);
      mover(id, pos); S.mover = null; if (S.criada && S.criada.id === id) { S.criada.posicao = pos; S.criada.desceram = fila().length - pos; } return render();
    }
    if (a === "sobe" || a === "desce") { const l = fila(), i = l.findIndex((o) => o.id === id); mover(id, i + 1 + (a === "sobe" ? -1 : 1)); S.msg = null; render(); const novo = document.querySelector(`[data-a="${a}"][data-id="${id}"]`); if (novo && !novo.disabled) novo.focus(); }
  });
  document.addEventListener("input", (ev) => {
    const t = ev.target, f = S.form;
    if (t.dataset.fdia) f.dias[t.dataset.fdia] = t.value;
    else if (["descricao", "lib", "cliente"].includes(t.id)) f[t.id] = t.value;
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target, f = S.form;
    if (t.id === "obra") f.obra = t.value;
    else if (t.name === "lugar") { f.lugar = t.value; document.getElementById("lugarBloco").innerHTML = "<legend>Lugar na fila</legend>" + blocoLugar(); }
    else if (t.id === "depoisDe") { f.depoisDe = t.value; document.getElementById("previa").textContent = previa(); }
    else if (t.id === "comprometida" || t.id === "prazoCurto") f[t.id] = t.checked;
    else if (t.dataset.fmaq) { const e = t.dataset.fmaq, v = +t.value; f.maq[e] = t.checked ? [...(f.maq[e] || []), v] : (f.maq[e] || []).filter((m) => m !== v); }
    else if (t.dataset.rdia) gravarDia(t);
  });
  function gravarDia(t, descer) {
    const o = porId(+t.dataset.id), e = t.dataset.rdia, v = parseDias(t.value);
    const volta = o.dias[e] == null ? "" : P.formatDias(o.dias[e]);
    if (v === undefined || (v === null && o.dias[e] != null)) { t.value = volta; t.style.borderColor = "#b91c1c"; S.msg = null; return; }
    if (v !== o.dias[e]) { o.dias[e] = v; S.msg = `${o.codigo}: ${P.etapaLabel(e)} atualizado.`; }
    const lista = fila(), i = lista.findIndex((x) => x.id === o.id), prox = descer && lista[i + 1];
    render();
    const alvo = document.querySelector(`[data-rdia="${e}"][data-id="${(prox || o).id}"]`); if (alvo) { alvo.focus(); alvo.select(); }
  }
  document.addEventListener("keydown", (ev) => { const t = ev.target; if (ev.key === "Enter" && t.dataset && t.dataset.rdia) { ev.preventDefault(); gravarDia(t, true); } });
  document.addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (ev.target.id === "fNova") return salvarNova();
    const id = ev.target.dataset.lib; if (!id) return;
    const v = ev.target.querySelector("input").value; if (!v) return;
    const o = porId(+id); o.lib = v; S.msg = `${o.codigo}: liberação ${fd(v)} gravada na simulação. A OF entrou no cálculo.`; render();
  });
  recomecar();
})();
</script>
</body></html>
